services:

  minio:

    build:

      context: /tmp/minio-source

      dockerfile: Dockerfile.local

    container_name: dealplus-minio

    command: server /data --console-address ":9001"

    ports:

      - "9000:9000"

      - "9001:9001"

    environment:

      MINIO_ROOT_USER: dealplus_admin

      MINIO_ROOT_PASSWORD: LocalMinio@2026

    volumes:

      - minio_document_data:/data

    restart: unless-stopped

  clamav:

    image: clamav/clamav:latest

    container_name: dealplus-clamav

    ports:

      - "3310:3310"

    volumes:

      - clamav_data:/var/lib/clamav

    restart: unless-stopped

volumes:

  minio_document_data:

  clamav_data:
 